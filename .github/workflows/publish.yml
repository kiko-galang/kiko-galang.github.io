name: Build and Deploy Site

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render notes
        run: quarto render notes/

      - name: Assemble site
        run: |
          mkdir -p _site/notes
          mkdir -p _site/tutorials
          cp index.html _site/
          cp cv.html _site/    || true
          cp baking.html _site/ || true
          cp -r tutorials/. _site/tutorials/
          cp -r images _site/images || true
          cp -r docs/notes/. _site/notes/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
